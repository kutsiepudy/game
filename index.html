<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Slime Hunter - An exciting battle game">
  <title>Slime Hunter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2300ff00'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="overworld" aria-label="Game world">
      <div id="sillyNPC" aria-label="Friendly NPC"></div>
      <div id="angryNPC" aria-label="Enemy NPC"></div>
    </section>

    <section id="characters" aria-label="Characters" style="display: none;">
      <div id="player" aria-label="Player character"></div>
      <div id="enemy" aria-label="Enemy slime"></div>
    </section>

    <section id="battleUI" aria-label="Battle interface" style="display: none;">
      <div class="health-display">
        <div id="playerHealth" aria-label="Player health"></div>
        <div id="enemyHealth" aria-label="Enemy health"></div>
      </div>
      <div class="battle-actions">
        <button id="damage" aria-label="Attack enemy">Attack</button>
        <button id="heal" aria-label="Restore health">Heal</button>
      </div>
    </section>

    <section id="text" aria-label="Game text" style="display: none;">
      <p id="dialogue-text"></p>
    </section>

    <section id="deathScreen" aria-label="Death screen" style="display: none;"></section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
